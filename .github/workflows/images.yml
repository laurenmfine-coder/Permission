name: Build curated images
on:
  push:
    branches: [main]
    paths:
      - 'tools/img/manifest.json'
      - 'tools/img/build.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: images
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow requests
      - run: python tools/img/build.py
      - name: Commit images
        run: |
          git config user.name "image-bot"
          git config user.email "image-bot@users.noreply.github.com"
          git add img tools/img/report.json || true
          git diff --cached --quiet || git commit -m "Build curated images [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
